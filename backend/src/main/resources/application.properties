# =============================================
# APPLICATION INFO
# =============================================
spring.application.name=backend
app.name=TeamFlow Task Management System
app.version=1.0.0
app.description=Task Management & Team Collaboration System

# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=8081

# =============================================
# DATABASE CONFIGURATION
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/teamflow?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# JWT CONFIGURATION
# =============================================
jwt.secret=YOUR_JWT_SECRET_KEY
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# =============================================
# SECURITY CONFIGURATION
# =============================================
app.security.login-attempts-limit=5
app.security.lockout-duration-minutes=15
app.security.password-min-length=8

# =============================================
# EMAIL CONFIGURATION
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_EMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=noreply@teamflow.com
app.mail.base-url=http://localhost:5173

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# =============================================
# OAUTH2 CONFIGURATION
# =============================================
oauth2.google.client-id=YOUR_GOOGLE_CLIENT_ID
oauth2.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET

oauth2.github.client-id=YOUR_GITHUB_CLIENT_ID
oauth2.github.client-secret=YOUR_GITHUB_CLIENT_SECRET

oauth2.google.token-info-url=https://oauth2.googleapis.com/tokeninfo
oauth2.google.userinfo-url=https://www.googleapis.com/oauth2/v3/userinfo
oauth2.github.userinfo-url=https://api.github.com/user
oauth2.github.email-url=https://api.github.com/user/emails

# =============================================
# CLOUDINARY CONFIGURATION
# =============================================
cloudinary.cloud-name=YOUR_CLOUDINARY_NAME
cloudinary.api-key=YOUR_CLOUDINARY_API_KEY
cloudinary.api-secret=YOUR_CLOUDINARY_API_SECRET

upload.max-file-size=5242880
upload.allowed-extensions=jpg,jpeg,png,gif
